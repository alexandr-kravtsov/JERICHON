        af_start: 0.02
        af_max: 0.2
        af_step: 0.02
      rsi:
        period: 14
      stochastic:
        k_period: 14
        d_period: 3
      fractals:
        window: 2
    entry_config:
      atr_mult_sl: 1.5
      atr_mult_tp: 3.0
    sl: 0.02
