# ============================================================
# КОНФИГУРАЦИИ СТРАТЕГИЙ
# ============================================================
# Каждая стратегия содержит:
#   name             - название (тикер_тип_доходность)
#   ticker           - тикер инструмента
#   indicator_config - параметры индикаторов
#   entry_config     - параметры входа (ATR множители)
#   sl               - stop loss в долях (0.02 = 2%)
#   tp               - take profit в долях (0.03 = 3%)
# ============================================================

strategies:
  # ---------- MTLR (Мечел) ----------
  - name: "MTLR_default"
    ticker: "MTLR"
    description: "Базовая стратегия для Мечела"
    indicator_config:
      alligator:
        jaw: 13
        jaw_shift: 8
        teeth: 8
        teeth_shift: 5
        lips: 5
        lips_shift: 3
      psar:
        af_start: 0.02
        af_max: 0.2
        af_step: 0.02
      rsi:
        period: 14
      stochastic:
        k_period: 14
        d_period: 3
      fractals:
        window: 2
    entry_config:
      atr_mult_sl: 1.5
      atr_mult_tp: 3.0
    sl: 0.02
    tp: 0.03

  - name: "MTLR_aggressive"
    ticker: "MTLR"
    description: "Агрессивная стратегия для Мечела"
    indicator_config:
      alligator:
        jaw: 8
        jaw_shift: 8
        teeth: 5
        teeth_shift: 5
        lips: 3
        lips_shift: 3
      psar:
        af_start: 0.03
        af_max: 0.3
        af_step: 0.02
      rsi:
        period: 7
      stochastic:
        k_period: 7
        d_period: 3
      fractals:
        window: 1
    entry_config:
      atr_mult_sl: 1.0
      atr_mult_tp: 4.0
    sl: 0.01
    tp: 0.05

